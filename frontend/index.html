<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PMDAMC</title>
    <meta name="theme-color" content="#12141c" />
    <!--
      Paint the person's own theme and accent BEFORE the app loads.
      Without this the page draws in the default dark green first and then
      jumps to their colours once React starts — a visible flash on every
      load. It only reads what appearance.js already worked out and cached
      (including the contrast-adjusted accent for each theme), so there is
      no colour logic here to drift out of step. Wrapped in try/catch:
      private browsing can make localStorage throw, and then the defaults
      in styles.css simply stand.
    -->
    <script>
      (function () {
        try {
          var cache = JSON.parse(localStorage.getItem("pmdamc.appearance") || "null");
          var themes = ["system", "light", "warm", "dark"];
          var pref = (cache && cache.theme) || localStorage.getItem("tfh_theme") || "dark";
          if (themes.indexOf(pref) < 0) pref = "dark";
          var painted = pref === "system"
            ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : pref;
          var root = document.documentElement;
          root.setAttribute("data-theme", painted);
          root.style.colorScheme = painted === "dark" ? "dark" : "light";
          // Only these names, and only colour values — the cache is ours,
          // but nothing read from storage gets to set arbitrary styles.
          // Must match MANAGED_VARS in src/appearance.js.
          var allowed = ["--accent", "--accent-ink", "--accent-soft", "--ink", "--panel", "--raised", "--line",
            "--text-dim", "--text-faint", "--chart-grid", "--chart-tick", "--chart-tooltip-bg"];
          var vars = cache && cache.vars && cache.vars[painted];
          if (vars) for (var i = 0; i < allowed.length; i++) {
            var value = vars[allowed[i]];
            if (value && /^#[0-9a-f]{6,8}$/i.test(value)) root.style.setProperty(allowed[i], value);
          }
          var chrome = { dark: "#12141c", light: "#f3f5f9", warm: "#f4ecdf" }[painted];
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta && chrome) meta.setAttribute("content", chrome);
        } catch (e) { /* defaults from styles.css stand */ }
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
